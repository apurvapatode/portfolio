<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050506" />

    <title>Apurva Patode — Freelance Frontend Developer</title>
    <meta
      name="description"
      content="Freelance frontend developer. Website fixes and full rebuilds in Next.js and TypeScript, performance, SEO and accessibility work, and high-end interactive builds."
    />

    <!-- ⚠️ apurvapatode.com does not currently resolve (no DNS). Until it is
         registered and pointed at the deployment, this canonical URL sends
         crawlers to a dead host — which is worse than having no canonical at
         all. Replace every occurrence of the domain (here, the og:url below,
         public/sitemap.xml and public/robots.txt) with the real deployed URL,
         e.g. the Vercel/Cloudflare Pages one, as soon as it exists. -->
    <link rel="canonical" href="https://apurvapatode.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Apurva Patode — Freelance Frontend Developer" />
    <meta
      property="og:description"
      content="Website fixes and full rebuilds in Next.js & TypeScript, performance and SEO work, and high-end interactive builds. Available for new clients."
    />
    <meta property="og:url" content="https://apurvapatode.com/" />
    <!-- TODO: add a 1200x630 og-image.png to /public for link previews. -->
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">

         you sell. Search engines use it for "freelance frontend developer"-style
         intent queries, which the Person type alone does not serve. -->

        "email": "apurvapatode01@gmail.com",
        "areaServed": "Worldwide",

          "@type": "Person",

        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Pune",
          "addressCountry": "IN"
        },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Services",

            {
